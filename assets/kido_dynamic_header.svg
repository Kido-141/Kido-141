<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="KIDO-141 developer header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>

    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2020" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff2020"/>
      <stop offset="0.75" stop-color="#ff4a4a"/>
      <stop offset="1" stop-color="#ff2020" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff2020" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff2020" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1200" height="360" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- Ambient red glow -->
    <ellipse cx="600" cy="180" rx="430" ry="180" fill="url(#glow)" filter="url(#blur)">
      <animate attributeName="opacity" values=".25;.55;.25" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Moving diagonal red trails -->
    <g opacity=".7">
      <path d="M-250 330 L180 -100" stroke="#ff2020" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;1100 0;0 0" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M-400 390 L220 -230" stroke="#ff2020" stroke-width="1" fill="none" opacity=".5">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;1250 0;0 0" dur="10s" repeatCount="indefinite"/>
      </path>
      <path d="M850 430 L1300 -20" stroke="#ff3030" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;-1100 0;0 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Horizontal scanning lines -->
    <g opacity=".6">
      <rect x="-250" y="72" width="250" height="2" fill="url(#redLine)">
        <animate attributeName="x" from="-250" to="1200" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-350" y="286" width="350" height="1" fill="url(#redLine)">
        <animate attributeName="x" from="-350" to="1200" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Decorative top/bottom rails -->
    <rect x="70" y="38" width="1060" height="1" fill="#ff2020" opacity=".8"/>
    <rect x="70" y="321" width="1060" height="1" fill="#ff2020" opacity=".8"/>

    <!-- Animated red nodes -->
    <g fill="#ff2020">
      <circle cx="90" cy="38" r="4">
        <animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1110" cy="321" r="4">
        <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Header content -->
    <text x="600" y="145"
          text-anchor="middle"
          fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif"
          font-size="66"
          font-weight="800"
          letter-spacing="2">
      KIDO-141
    </text>

    <text x="600" y="185"
          text-anchor="middle"
          fill="#ff2020"
          font-family="monospace"
          font-size="16"
          font-weight="700"
          letter-spacing="4">
      DEVELOPER  •  CREATOR  •  PROBLEM SOLVER
    </text>

    <!-- Dynamic subtitle -->
    <text x="600" y="230"
          text-anchor="middle"
          fill="#bcbcbc"
          font-family="monospace"
          font-size="14">
      <tspan>ALWAYS LEARNING</tspan>
      <animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/>
    </text>

    <!-- Status indicators -->
    <g font-family="monospace" font-size="11">
      <text x="600" y="270" text-anchor="middle" fill="#777777">
        <tspan fill="#ff2020">●</tspan>
        <tspan dx="8">SYSTEM ONLINE</tspan>
        <tspan dx="28" fill="#ff2020">●</tspan>
        <tspan dx="8">BUILDING</tspan>
        <tspan dx="28" fill="#ff2020">●</tspan>
        <tspan dx="8">CREATING</tspan>
      </text>
    </g>

    <!-- Cursor -->
    <rect x="719" y="217" width="8" height="16" fill="#ff2020">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Fine scanline -->
    <rect x="0" y="0" width="1200" height="1" fill="#ff2020" opacity=".25">
      <animate attributeName="y" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
